<!DOCTYPE html>
<html lang="ja">
<head prefix="og: https://ogp.me/ns#">
<meta property="og:url" content="https://keitagames.com">
  <meta property="og:type" content="website"> 
  <meta property="og:title" content="ドパ描き | ドパガキ専用place">
  <meta property="og:description" content="待機時間のない現代的なオンラインピクセルキャンバス、「ドパ描き」へ行こう">
  <meta property="og:site_name" content="Dopamine Draw">
  
  <!-- OGP画像の設定 -->
  <meta property="og:image" content="ogp.png">
  
  <!-- X（旧Twitter）用の追加設定（必要に応じて） -->
  <meta name="twitter:card" content="DD">
<meta charset="utf-8">
<link rel="icon" href="favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ドパ描き | DopamineDraw</title>
<style>
  :root {
    --bg: #000000; --fg: #1b1b1b; --bar: #ffffff; --line: #cfcfc8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #e8e8e8; --bar: #2a2c2f; --line: #44474b; }
  }
  html, body { height: 100%; margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  #view {
    flex: 1; position: relative; overflow: hidden; cursor: grab;
    touch-action: none; background: #000000;
  }
  #view:active { cursor: grabbing; }
  canvas {
    position: absolute; top: 0; left: 0;
    display: block; background: #fff;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 12px rgba(0,0,0,0.15);
    transform-origin: 0 0;
  }
  #ov {
    background: transparent; box-shadow: none;
    image-rendering: auto; width: 100%; height: 100%;
    pointer-events: none;
  }
  #bar {
    background: var(--bar); border-top: 1px solid var(--line);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 8px; z-index: 10;
  }
  #pal {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    gap: 3px;
    max-height: 120px;
    overflow-y: auto;
  }
  @media (max-width: 600px) {
    #pal { grid-template-columns: repeat(8, 1fr); max-height: 110px; }
  }
  #pal button {
    aspect-ratio: 1; border: 2px solid transparent; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); cursor: pointer; padding: 0;
  }
  #pal button[aria-pressed="true"] {
    border-color: var(--fg);
    box-shadow: 0 0 0 2px var(--bar), 0 0 0 4px var(--fg);
    z-index: 1;
  }
  #pal button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #info { display: flex; align-items: center; gap: 8px; }
  #info span { flex: 1; font-size: 13px; }
  #info button {
    min-width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bar); color: var(--fg); font-size: 16px; cursor: pointer;
  }
  #info button:hover { background: var(--bg); }
  #dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c33; margin-right: 6px; }
  #dot.on { background: #2a9d4b; }
</style>
</head>
<body>
<div id="view"><canvas id="c"></canvas><canvas id="ov"></canvas></div>
<div id="bar">
  <div id="pal"></div>
  <div id="info">
    <span><i id="dot"></i><b id="status">接続中</b> <b id="pos">-</b></span>
    <button id="zout" aria-label="縮小">－</button>
    <button id="zin" aria-label="拡大">＋</button>
  </div>
</div>

<script>
const W = 2000, H = 2000;
const API = 'place.cgi';

// 64色カラーパレット
const PAL = [
  // 1. モノクロ・グレー・茶系 (16色)
  '#ffffff', '#000000', '#1a1a1a', '#333333', '#555555', '#777777', '#999999', '#bbbbbb', '#dddddd',
  '#2c1e13', '#4e3322', '#784d31', '#a66e4e', '#cf9b7a', '#e8ccb8', '#f7f0eb',
  // 2. 赤・ピンク・紫 (16色)
  '#3b000b', '#6b0014', '#9e0d21', '#d32f2f', '#f44336', '#ff7961', '#ffb2b2', '#ffebee',
  '#4a0033', '#7b0052', '#ad1457', '#e91e63', '#f06292', '#f8bbd0', '#8e24aa', '#ce93d8',
  // 3. 青・水色・シアン (16色)
  '#1a237e', '#283593', '#3f51b5', '#5c6bc0', '#9fa8da', '#0d47a1', '#1976d2', '#42a5f5',
  '#90caf9', '#e3f2fd', '#006064', '#00838f', '#00acc1', '#26c6da', '#80deea', '#e0f7fa',
  // 4. 緑・黄・オレンジ (16色)
  '#004d40', '#00796b', '#009688', '#4db6ac', '#80cbc4', '#1b5e20', '#388e3c', '#4caf50',
  '#81c784', '#c8e6c9', '#f57f17', '#fbc02d', '#ffeb3b', '#fff59d', '#e65100', '#ff9800'
];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

const view = document.getElementById('view');
let scale = 1;
let panX = 0, panY = 0;
let color = 3;

// ---- グリッド & カーソル オーバーレイ ----
const ov = document.getElementById('ov');
const octx = ov.getContext('2d');
const GRID_MIN = 8;     // この倍率以上でマス目を表示
const CURSOR_MIN = 4;   // この倍率以上でカーソルを表示
let hover = null;       // {x, y} 現在ポイントしているマス
let dpr = 1;

function resizeOverlay() {
  dpr = window.devicePixelRatio || 1;
  ov.width = Math.round(view.clientWidth * dpr);
  ov.height = Math.round(view.clientHeight * dpr);
  drawOverlay();
}

function drawOverlay() {
  const vw = view.clientWidth, vh = view.clientHeight;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, vw, vh);

  // マス目
  if (scale >= GRID_MIN) {
    const x0 = Math.max(0, Math.floor(-panX / scale));
    const x1 = Math.min(W, Math.ceil((vw - panX) / scale));
    const y0 = Math.max(0, Math.floor(-panY / scale));
    const y1 = Math.min(H, Math.ceil((vh - panY) / scale));
    const sx0 = panX + x0 * scale, sx1 = panX + x1 * scale;
    const sy0 = panY + y0 * scale, sy1 = panY + y1 * scale;
    octx.beginPath();
    for (let x = x0; x <= x1; x++) {
      const sx = Math.round(panX + x * scale) + 0.5;
      octx.moveTo(sx, sy0); octx.lineTo(sx, sy1);
    }
    for (let y = y0; y <= y1; y++) {
      const sy = Math.round(panY + y * scale) + 0.5;
      octx.moveTo(sx0, sy); octx.lineTo(sx1, sy);
    }
    octx.lineWidth = 1;
    octx.strokeStyle = 'rgba(128,128,128,0.45)';
    octx.stroke();
  }

  // カーソル (選択中の色のプレビュー + 二重枠)
  if (hover && scale >= CURSOR_MIN &&
      hover.x >= 0 && hover.x < W && hover.y >= 0 && hover.y < H) {
    const sx = panX + hover.x * scale;
    const sy = panY + hover.y * scale;
    octx.globalAlpha = 0.6;
    octx.fillStyle = PAL[color];
    octx.fillRect(sx, sy, scale, scale);
    octx.globalAlpha = 1;
    octx.lineWidth = 1;
    octx.strokeStyle = '#000';
    octx.strokeRect(sx + 0.5, sy + 0.5, scale - 1, scale - 1);
    if (scale >= 6) {
      octx.strokeStyle = '#fff';
      octx.strokeRect(sx + 1.5, sy + 1.5, scale - 3, scale - 3);
    }
  }
}

function updateTransform() {
  cv.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  drawOverlay();
}
window.addEventListener('resize', resizeOverlay);

// 画面中央に初期ズーム＆位置調整
function initView() {
  const vw = view.clientWidth;
  const vh = view.clientHeight;
  scale = 2;
  panX = (vw - W * scale) / 2;
  panY = (vh - H * scale) / 2;
  updateTransform();
}
window.addEventListener('load', () => { resizeOverlay(); initView(); });

// 任意座標を中心としたズーム
function zoomAt(cx, cy, factor) {
  const oldScale = scale;
  let newScale = scale * factor;
  newScale = Math.min(Math.max(newScale, 0.05), 40); // 最小・最大ズーム制限

  panX = cx - (cx - panX) * (newScale / oldScale);
  panY = cy - (cy - panY) * (newScale / oldScale);
  scale = newScale;

  updateTransform();
}

// ズームボタン
document.getElementById('zin').onclick = () => zoomAt(view.clientWidth / 2, view.clientHeight / 2, 1.4);
document.getElementById('zout').onclick = () => zoomAt(view.clientWidth / 2, view.clientHeight / 2, 1 / 1.4);

// ホイールズーム
view.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = view.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  zoomAt(cx, cy, e.deltaY < 0 ? 1.2 : 1 / 1.2);
}, { passive: false });

// Pointer Events によるパン操作 & ピンチズーム & 描画
const activePointers = new Map();
let startDist = 0;
let startScale = scale;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let panStartX = 0, panStartY = 0;
let hasMoved = false;

view.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try { view.setPointerCapture(e.pointerId); } catch (_) {}
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  {
    const r = view.getBoundingClientRect();
    hover = { x: Math.floor((e.clientX - r.left - panX) / scale),
              y: Math.floor((e.clientY - r.top - panY) / scale) };
    drawOverlay();
  }

  if (activePointers.size === 1) {
    isDragging = true;
    hasMoved = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
  } else if (activePointers.size === 2) {
    isDragging = false;
    const pts = Array.from(activePointers.values());
    startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    startScale = scale;
  }
});

view.addEventListener('pointermove', (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  const rect = view.getBoundingClientRect();
  const vx = e.clientX - rect.left;
  const vy = e.clientY - rect.top;
  const canvasX = Math.floor((vx - panX) / scale);
  const canvasY = Math.floor((vy - panY) / scale);

  if (!hover || hover.x !== canvasX || hover.y !== canvasY) {
    hover = { x: canvasX, y: canvasY };
    drawOverlay();
  }

  if (canvasX >= 0 && canvasX < W && canvasY >= 0 && canvasY < H) {
    document.getElementById('pos').textContent = `${canvasX}, ${canvasY}`;
  } else {
    document.getElementById('pos').textContent = `-`;
  }

  if (activePointers.size === 1 && isDragging) {
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
      hasMoved = true;
    }
    panX = panStartX + dx;
    panY = panStartY + dy;
    updateTransform();
  } else if (activePointers.size === 2) {
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (startDist > 0) {
      const centerClientX = (pts[0].x + pts[1].x) / 2 - rect.left;
      const centerClientY = (pts[0].y + pts[1].y) / 2 - rect.top;
      const factor = dist / startDist;
      const targetScale = Math.min(Math.max(startScale * factor, 0.05), 40);

      panX = centerClientX - (centerClientX - panX) * (targetScale / scale);
      panY = centerClientY - (centerClientY - panY) * (targetScale / scale);
      scale = targetScale;
      updateTransform();
    }
  }
});

function handlePointerEnd(e) {
  if (!activePointers.has(e.pointerId)) return;
  if (e.type === 'pointerup' && !hasMoved && isDragging && activePointers.size === 1) {
    const rect = view.getBoundingClientRect();
    const vx = e.clientX - rect.left;
    const vy = e.clientY - rect.top;
    const x = Math.floor((vx - panX) / scale);
    const y = Math.floor((vy - panY) / scale);

    if (x >= 0 && x < W && y >= 0 && y < H) {
      const prev = board[y * W + x];
      const cur = color;
      draw(x, y, cur);
      fetch(API, { method: 'POST', body: new URLSearchParams({ a: 'place', x, y, c: cur }) })
        .then(r => { if (!r.ok) throw new Error(r.status); })
        .catch(() => draw(x, y, prev));   // サーバーに保存できなかったら元に戻す
    }
  }
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) startDist = 0;
  if (activePointers.size === 0) isDragging = false;
}

view.addEventListener('pointerleave', (e) => {
  if (e.pointerType === 'mouse' && activePointers.size === 0) { hover = null; drawOverlay(); }
});
view.addEventListener('pointerup', handlePointerEnd);
view.addEventListener('pointercancel', handlePointerEnd);

// パレット生成
const pal = document.getElementById('pal');
PAL.forEach((hex, i) => {
  const b = document.createElement('button');
  b.style.background = hex;
  b.setAttribute('aria-label', '色 ' + (i + 1));
  b.setAttribute('aria-pressed', i === color);
  b.onclick = () => {
    color = i;
    drawOverlay();
    [...pal.children].forEach((el, j) => el.setAttribute('aria-pressed', j === i));
  };
  pal.appendChild(b);
});

const board = new Uint8Array(W * H);
function draw(x, y, c) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  if (!PAL[c]) c = 0;
  board[y * W + x] = c;
  ctx.fillStyle = PAL[c];
  ctx.fillRect(x, y, 1, 1);
}

// 盤面を一括描画 (1px ずつ fillRect するより圧倒的に速い)
function paintBoard(buf) {
  const rgb = PAL.map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let i = 0; i < buf.length && i < W * H; i++) {
    const c = rgb[buf[i]] ? buf[i] : 0;
    board[i] = c;
    const o = i * 4;
    d[o] = rgb[c][0]; d[o+1] = rgb[c][1]; d[o+2] = rgb[c][2]; d[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// SSE
const dot = document.getElementById('dot'), status = document.getElementById('status');
let lastSeq = 0;
function connect(seq) {
  lastSeq = seq;
  const es = new EventSource(`${API}?a=stream&from=${lastSeq}`);
  es.onopen = () => { dot.className = 'on'; status.textContent = 'ライブ'; };
  es.onmessage = (e) => {
    if (e.lastEventId) lastSeq = parseInt(e.lastEventId, 10) || lastSeq;
    for (const p of e.data.split(';')) {
      const [x, y, c] = p.split(',').map(Number);
      draw(x, y, c);
    }
  };
  es.onerror = () => {
    dot.className = ''; status.textContent = '再接続中';
    if (es.readyState === EventSource.CLOSED) {   // ブラウザが諦めた場合は自前で再接続
      setTimeout(() => connect(lastSeq), 2000);
    }
  };
}

// 起動処理
(async () => {
  try {
    const res = await fetch(API + '?a=board', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const seq = parseInt(res.headers.get('X-Seq') || '0', 10);
    paintBoard(new Uint8Array(await res.arrayBuffer()));
    connect(seq);
  } catch (e) {
    status.textContent = '読み込み失敗';
  }
})();
</script>
</body>
</html>
