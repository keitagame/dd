// 言語自動判定 (URLパラメータ > localStorage > ブラウザ言語)
function detectLanguage() {
  const urlParams = new URLSearchParams(window.location.search);
  const paramLang = urlParams.get('lang');
  if (paramLang && TRANSLATIONS[paramLang]) return paramLang;

  try {
    const saved = localStorage.getItem('dd_lang');
    if (saved && TRANSLATIONS[saved]) return saved;
  } catch (e) {}

  const navLang = (navigator.language || navigator.userLanguage || '').slice(0, 2);
  return TRANSLATIONS[navLang] ? navLang : 'ja';
}

let currentLang = detectLanguage();

function t(key) {
  return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) ||
         (TRANSLATIONS.ja && TRANSLATIONS.ja[key]) || key;
}

function updateDOMTranslations() {
  document.documentElement.lang = currentLang;

  // テキストノード更新
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key) el.textContent = t(key);
  });

  // 属性更新 (例: data-i18n-attr="placeholder:chat_placeholder,title:add_server_title")
  document.querySelectorAll('[data-i18n-attr]').forEach(el => {
    const pairs = el.getAttribute('data-i18n-attr').split(',');
    pairs.forEach(pair => {
      const [attr, key] = pair.split(':').map(s => s.trim());
      if (attr && key) el.setAttribute(attr, t(key));
    });
  });

  // メタタグ類
  document.title = t('doc_title');
  const metaDesc = document.getElementById('metaDesc');
  if (metaDesc) metaDesc.setAttribute('content', t('meta_desc'));

  // 色パレットアクセシビリティテキストの再設定
  const pal = document.getElementById('pal');
  if (pal) {
    [...pal.children].forEach((b, i) => {
      b.setAttribute('aria-label', t('color_prefix') + (i + 1));
    });
  }

  // チャット名の再レンダリング
  renderChatName();
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;
ctx.webkitImageSmoothingEnabled = false;
const view = document.getElementById('view');
let scale = 1;
let panX = 0, panY = 0;
let color = 3;

// ---- グリッド & カーソル オーバーレイ ----
const ov = document.getElementById('ov');
const octx = ov.getContext('2d');
const GRID_MIN = 8;     // この倍率以上でマス目を表示
const CURSOR_MIN = 4;   // この倍率以上でカーソルを表示
let hover = null;       // {x, y} 現在ポイントしているマス
let dpr = 1;

function resizeOverlay() {
  dpr = window.devicePixelRatio || 1;
  ov.width = Math.round(view.clientWidth * dpr);
  ov.height = Math.round(view.clientHeight * dpr);
  drawOverlay();
}

function drawOverlay() {
  const vw = view.clientWidth, vh = view.clientHeight;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, vw, vh);

  // マス目
  if (scale >= GRID_MIN) {
    const x0 = Math.max(0, Math.floor(-panX / scale));
    const x1 = Math.min(W, Math.ceil((vw - panX) / scale));
    const y0 = Math.max(0, Math.floor(-panY / scale));
    const y1 = Math.min(H, Math.ceil((vh - panY) / scale));
    const sx0 = panX + x0 * scale, sx1 = panX + x1 * scale;
    const sy0 = panY + y0 * scale, sy1 = panY + y1 * scale;
    octx.beginPath();
    for (let x = x0; x <= x1; x++) {
      const sx = Math.round(panX + x * scale) + 0.5;
      octx.moveTo(sx, sy0); octx.lineTo(sx, sy1);
    }
    for (let y = y0; y <= y1; y++) {
      const sy = Math.round(panY + y * scale) + 0.5;
      octx.moveTo(sx0, sy); octx.lineTo(sx1, sy);
    }
    octx.lineWidth = 1;
    octx.strokeStyle = 'rgba(128,128,128,0.45)';
    octx.stroke();
  }

  // カーソル (選択中の色のプレビュー + 二重枠)
  if (hover && scale >= CURSOR_MIN &&
      hover.x >= 0 && hover.x < W && hover.y >= 0 && hover.y < H) {
    const sx = panX + hover.x * scale;
    const sy = panY + hover.y * scale;
    octx.globalAlpha = 0.6;
    octx.fillStyle = PAL[color];
    octx.fillRect(sx, sy, scale, scale);
    octx.globalAlpha = 1;
    octx.lineWidth = 1;
    octx.strokeStyle = '#000';
    octx.strokeRect(sx + 0.5, sy + 0.5, scale - 1, scale - 1);
    if (scale >= 6) {
      octx.strokeStyle = '#fff';
      octx.strokeRect(sx + 1.5, sy + 1.5, scale - 3, scale - 3);
    }
  }
}
function updateTransform() {
  // transform: scale() ではなく CSS の width / height で拡大することでスマホのぼやけを完全に防ぎます
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.style.transform = `translate(${panX}px, ${panY}px)`;
  drawOverlay();
}
window.addEventListener('resize', resizeOverlay);

// 画面中央に初期ズーム＆位置調整
function initView() {
  const vw = view.clientWidth;
  const vh = view.clientHeight;
  scale = 2;
  panX = (vw - W * scale) / 2;
  panY = (vh - H * scale) / 2;
  updateTransform();
}
window.addEventListener('load', () => { resizeOverlay(); initView(); updateDOMTranslations(); });

// 任意座標を中心としたズーム
function zoomAt(cx, cy, factor) {
  const oldScale = scale;
  let newScale = scale * factor;
  newScale = Math.min(Math.max(newScale, 0.05), 40);

  panX = cx - (cx - panX) * (newScale / oldScale);
  panY = cy - (cy - panY) * (newScale / oldScale);
  scale = newScale;

  updateTransform();
}

// ズームボタン
document.getElementById('zin').onclick = () => zoomAt(view.clientWidth / 2, view.clientHeight / 2, 1.4);
document.getElementById('zout').onclick = () => zoomAt(view.clientWidth / 2, view.clientHeight / 2, 1 / 1.4);

// ホイールズーム
view.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = view.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  zoomAt(cx, cy, e.deltaY < 0 ? 1.2 : 1 / 1.2);
}, { passive: false });

// Pointer Events によるパン操作 & ピンチズーム & 描画
const activePointers = new Map();
let startDist = 0;
let startScale = scale;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let panStartX = 0, panStartY = 0;
let hasMoved = false;

view.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try { view.setPointerCapture(e.pointerId); } catch (_) {}
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  {
    const r = view.getBoundingClientRect();
    hover = { x: Math.floor((e.clientX - r.left - panX) / scale),
              y: Math.floor((e.clientY - r.top - panY) / scale) };
    drawOverlay();
  }

  if (activePointers.size === 1) {
    isDragging = true;
    hasMoved = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
  } else if (activePointers.size === 2) {
    isDragging = false;
    const pts = Array.from(activePointers.values());
    startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    startScale = scale;
  }
});

view.addEventListener('pointermove', (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  const rect = view.getBoundingClientRect();
  const vx = e.clientX - rect.left;
  const vy = e.clientY - rect.top;
  const canvasX = Math.floor((vx - panX) / scale);
  const canvasY = Math.floor((vy - panY) / scale);

  if (!hover || hover.x !== canvasX || hover.y !== canvasY) {
    hover = { x: canvasX, y: canvasY };
    drawOverlay();
  }

  if (canvasX >= 0 && canvasX < W && canvasY >= 0 && canvasY < H) {
    document.getElementById('pos').textContent = `${canvasX}, ${canvasY}`;
  } else {
    document.getElementById('pos').textContent = `-`;
  }

  if (activePointers.size === 1 && isDragging) {
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
      hasMoved = true;
    }
    panX = panStartX + dx;
    panY = panStartY + dy;
    updateTransform();
  } else if (activePointers.size === 2) {
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (startDist > 0) {
      const centerClientX = (pts[0].x + pts[1].x) / 2 - rect.left;
      const centerClientY = (pts[0].y + pts[1].y) / 2 - rect.top;
      const factor = dist / startDist;
      const targetScale = Math.min(Math.max(startScale * factor, 0.05), 40);

      panX = centerClientX - (centerClientX - panX) * (targetScale / scale);
      panY = centerClientY - (centerClientY - panY) * (targetScale / scale);
      scale = targetScale;
      updateTransform();
    }
  }
});

function handlePointerEnd(e) {
  if (!activePointers.has(e.pointerId)) return;
  if (e.type === 'pointerup' && !hasMoved && isDragging && activePointers.size === 1) {
    const rect = view.getBoundingClientRect();
    const vx = e.clientX - rect.left;
    const vy = e.clientY - rect.top;
    const x = Math.floor((vx - panX) / scale);
    const y = Math.floor((vy - panY) / scale);

    if (x >= 0 && x < W && y >= 0 && y < H) {
      const prev = board[y * W + x];
      const cur = color;
      const api = currentApi;
      const params = { a: 'place', x, y, c: cur };
      if (proofs.has(api)) params.t = proofs.get(api);
      draw(x, y, cur);
      fetch(api, { method: 'POST', body: new URLSearchParams(params) })
        .then(r => { if (!r.ok) { const e = new Error(r.status); e.status = r.status; throw e; } })
        .catch((err) => {
          draw(x, y, prev);
          // 認証なし/期限切れ: 再認証 (Turnstile未対応の外部サーバーは403を返さないので影響なし)
          if (err.status === 403) { proofs.delete(api); showVerify(api); }
        });
    }
  }
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) startDist = 0;
  if (activePointers.size === 0) isDragging = false;
}

view.addEventListener('pointerleave', (e) => {
  if (e.pointerType === 'mouse' && activePointers.size === 0) { hover = null; drawOverlay(); }
});
view.addEventListener('pointerup', handlePointerEnd);
view.addEventListener('pointercancel', handlePointerEnd);

// ---- Turnstile (サーバーごとにセッション1回認証) ----
const TURNSTILE_SITEKEY = '0x4AAAAAAFUK-QeqeNfUeQNP';
const proofs = new Map();   // サーバーURL -> 認証トークン (メモリのみ)
const verifyEl = document.getElementById('verify');
const verifyMsg = document.getElementById('verifyMsg');
let tsWidgetId = null;
let verifyApi = null;

function showVerify(api) {
  verifyApi = api;
  verifyMsg.textContent = '';
  verifyEl.hidden = false;
  renderTurnstile();
}
function hideVerify() { verifyEl.hidden = true; }
document.getElementById('verifyClose').onclick = hideVerify;

function renderTurnstile() {
  if (!window.turnstile) {   // api.js 読み込み待ち
    setTimeout(() => { if (!verifyEl.hidden) renderTurnstile(); }, 200);
    return;
  }
  if (tsWidgetId === null) {
    tsWidgetId = turnstile.render('#tsBox', {
      sitekey: TURNSTILE_SITEKEY,
      action: 'place',
      callback: onTurnstileToken,
      'error-callback': (code) => { verifyMsg.textContent = t('verify_failed') + ' [' + code + ']'; return true; },
      'timeout-callback': () => { verifyMsg.textContent = t('verify_failed') + ' [timeout]'; },
      'unsupported-callback': () => { verifyMsg.textContent = t('verify_failed') + ' [unsupported]'; }
    });
  } else {
    turnstile.reset(tsWidgetId);   // トークンは1回限りなので再表示時にリセット
  }
}

async function onTurnstileToken(token) {
  const api = verifyApi;
  try {
    const r = await fetch(api, {
      method: 'POST',
      body: new URLSearchParams({ a: 'verify', 'cf-turnstile-response': token })
    });
    const body = (await r.text()).trim();
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + body.slice(0, 80));
    proofs.set(api, body);
    hideVerify();
  } catch (e) {
    verifyMsg.textContent = t('verify_failed') + ' [' + (e && e.message || 'network') + ']';
    turnstile.reset(tsWidgetId);
  }
}

// パレット生成
const pal = document.getElementById('pal');
PAL.forEach((hex, i) => {
  const b = document.createElement('button');
  b.style.background = hex;
  b.setAttribute('aria-label', t('color_prefix') + (i + 1));
  b.setAttribute('aria-pressed', i === color);
  b.onclick = () => {
    color = i;
    drawOverlay();
    [...pal.children].forEach((el, j) => el.setAttribute('aria-pressed', j === i));
  };
  pal.appendChild(b);
});

const board = new Uint8Array(W * H);
function draw(x, y, c) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  if (!PAL[c]) c = 0;
  board[y * W + x] = c;
  ctx.fillStyle = PAL[c];
  ctx.fillRect(x, y, 1, 1);
}

// 盤面を一括描画
function paintBoard(buf) {
  const rgb = PAL.map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let i = 0; i < buf.length && i < W * H; i++) {
    const c = rgb[buf[i]] ? buf[i] : 0;
    board[i] = c;
    const o = i * 4;
    d[o] = rgb[c][0]; d[o+1] = rgb[c][1]; d[o+2] = rgb[c][2]; d[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// SSE & サーバー接続管理
const dot = document.getElementById('dot'), status = document.getElementById('status');
let lastSeq = 0;
let currentEventSource = null;

function connect(apiUrl, seq) {
  if (currentEventSource) {
    currentEventSource.close();
    currentEventSource = null;
  }

  lastSeq = seq;
  const es = new EventSource(`${apiUrl}?a=stream&from=${lastSeq}`);
  currentEventSource = es;

  es.onopen = () => { dot.className = 'on'; status.textContent = t('status_live'); };
  es.onmessage = (e) => {
    if (e.lastEventId) lastSeq = parseInt(e.lastEventId, 10) || lastSeq;
    for (const p of e.data.split(';')) {
      const [x, y, c] = p.split(',').map(Number);
      draw(x, y, c);
    }
  };
  es.onerror = () => {
    dot.className = ''; status.textContent = t('status_reconnecting');
    if (es.readyState === EventSource.CLOSED && currentEventSource === es) {
      setTimeout(() => {
        if (currentEventSource === es) connect(apiUrl, lastSeq);
      }, 2000);
    }
  };
}

async function loadAndConnectServer(apiUrl) {
  connectChat(apiUrl);
  if (currentEventSource) {
    currentEventSource.close();
    currentEventSource = null;
  }
  
  dot.className = '';
  status.textContent = t('status_connecting');

  try {
    const res = await fetch(apiUrl + '?a=board', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const seq = parseInt(res.headers.get('X-Seq') || '0', 10);
    paintBoard(new Uint8Array(await res.arrayBuffer()));
    connect(apiUrl, seq);
  } catch (e) {
    status.textContent = t('status_failed');
  }
}

// ---- チャット ----
const chatEl = document.getElementById('chat');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const chatBtn = document.getElementById('chatBtn');
const chatBadge = document.getElementById('chatBadge');
const chatDot = document.getElementById('chatDot');
const chatState = document.getElementById('chatState');
const chatNameBtn = document.getElementById('chatName');
const barEl = document.getElementById('bar');

function updateBarH() {
  document.documentElement.style.setProperty('--bar-h', barEl.offsetHeight + 'px');
}
updateBarH();
if (window.ResizeObserver) new ResizeObserver(updateBarH).observe(barEl);
window.addEventListener('resize', updateBarH);

// 名前 (設定モーダル内の入力欄で編集)
let chatName = '';
try { chatName = localStorage.getItem('dd_name') || ''; } catch (e) {}
const nameInput = document.getElementById('nameInput');
function renderChatName() {
  chatNameBtn.textContent = chatName || t('chat_default_name');
  nameInput.placeholder = t('chat_default_name');
  if (document.activeElement !== nameInput) nameInput.value = chatName;
}
nameInput.addEventListener('input', () => {
  chatName = nameInput.value.trim().slice(0, 20);
  try { localStorage.setItem('dd_name', chatName); } catch (e) {}
  chatNameBtn.textContent = chatName || t('chat_default_name');
});
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); closeSettings(); }
});
chatNameBtn.onclick = () => openSettings(nameInput);

// ---- 設定モーダル ----
const settingsEl = document.getElementById('settings');
const settingsBtn = document.getElementById('settingsBtn');
const settingsClose = document.getElementById('settingsClose');
let settingsReturnFocus = null;

function openSettings(focusEl) {
  settingsReturnFocus = document.activeElement;
  settingsEl.hidden = false;
  (focusEl || settingsClose).focus();
}
function closeSettings() {
  if (settingsEl.hidden) return;
  settingsEl.hidden = true;
  serverMsg.textContent = '';
  if (settingsReturnFocus && settingsReturnFocus.focus) settingsReturnFocus.focus();
}
settingsBtn.onclick = () => openSettings();
settingsClose.onclick = closeSettings;

let downOnBackdrop = false;
settingsEl.addEventListener('pointerdown', (e) => { downOnBackdrop = e.target === settingsEl; });
settingsEl.addEventListener('click', (e) => { if (downOnBackdrop && e.target === settingsEl) closeSettings(); });
settingsEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); closeSettings(); return; }
  if (e.key !== 'Tab') return;
  const f = [...settingsEl.querySelectorAll('button, input, select')]
    .filter(el => !el.disabled && el.getClientRects().length);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

// 開閉 & 未読バッジ
let chatOpen = window.innerWidth >= 700;
let unread = 0;
function updateBadge() {
  chatBadge.hidden = unread === 0;
  chatBadge.textContent = unread > 99 ? '99+' : String(unread);
}
function setChatOpen(v) {
  chatOpen = v;
  chatEl.hidden = !v;
  if (v) {
    unread = 0; updateBadge();
    chatLog.scrollTop = chatLog.scrollHeight;
    if (window.matchMedia('(pointer: fine)').matches) chatInput.focus();
  }
}
chatBtn.onclick = () => setChatOpen(!chatOpen);
document.getElementById('chatClose').onclick = () => setChatOpen(false);

// 受信
const pad2 = n => String(n).padStart(2, '0');
let chatApi = '';
let chatES = null;
let chatTimer = null;
let chatRetry = 0;
let chatLive = false;
let lastChatId = 0;

function chatUrlFor(api) { return api.replace(/[^\/]*$/, 'chat.cgi'); }

function addChatMessage(m) {
  if (!m || !(m.id > lastChatId)) return;
  lastChatId = m.id;
  const atBottom = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 24;

  const row = document.createElement('div');
  const tEl = document.createElement('span');
  const d = new Date(m.t * 1000);
  tEl.className = 't';
  tEl.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const n = document.createElement('b');
  n.textContent = m.n || t('chat_default_name');
  const x = document.createElement('span');
  x.textContent = m.m;
  row.append(tEl, n, x);
  chatLog.appendChild(row);
  while (chatLog.children.length > 200) chatLog.removeChild(chatLog.firstChild);

  if (atBottom) chatLog.scrollTop = chatLog.scrollHeight;
  if (!chatOpen && chatLive) { unread++; updateBadge(); }
}

function disconnectChat() {
  clearTimeout(chatTimer);
  if (chatES) { chatES.close(); chatES = null; }
}

function openChatStream() {
  const es = new EventSource(`${chatApi}?a=stream&from=${lastChatId}`);
  chatES = es;
  es.onopen = () => {
    chatDot.className = 'on'; chatState.textContent = '';
    chatLive = false; chatRetry = 0;
  };
  es.onmessage = (e) => { try { addChatMessage(JSON.parse(e.data)); } catch (_) {} };
  es.addEventListener('ready', () => {
    chatLive = true;
    chatLog.scrollTop = chatLog.scrollHeight;
  });
  es.onerror = () => {
    chatDot.className = '';
    if (es.readyState === EventSource.CLOSED && chatES === es) {
      chatState.textContent = t('chat_cannot_connect');
      const wait = Math.min(30000, 2000 * Math.pow(2, chatRetry++));
      chatTimer = setTimeout(() => { if (chatES === es) openChatStream(); }, wait);
    } else {
      chatState.textContent = t('chat_reconnecting');
    }
  };
}

function connectChat(apiUrl) {
  disconnectChat();
  chatApi = chatUrlFor(apiUrl);
  lastChatId = 0; chatRetry = 0; chatLive = false;
  chatLog.textContent = '';
  unread = 0; updateBadge();
  chatDot.className = ''; chatState.textContent = t('status_connecting');
  openChatStream();
}

// 送信
async function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !chatApi) return;
  chatSend.disabled = true;
  let msg = '';
  try {
    const r = await fetch(chatApi, {
      method: 'POST',
      body: new URLSearchParams({ a: 'post', name: chatName || t('chat_default_name'), text })
    });
    if (r.ok) {
      chatInput.value = '';
    } else {
      try { msg = (await r.json()).error || ''; } catch (_) {}
      msg = msg || t('chat_send_failed');
    }
  } catch (_) {
    msg = t('chat_send_failed');
  }
  chatSend.disabled = false;
  if (msg) {
    chatState.textContent = msg;
    setTimeout(() => { if (chatState.textContent === msg) chatState.textContent = ''; }, 3000);
  }
  chatInput.focus();
}
chatSend.onclick = sendChat;
chatSend.addEventListener('mousedown', (e) => e.preventDefault());
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    sendChat();
  }
});

setChatOpen(chatOpen);

// 起動処理
loadAndConnectServer(currentApi);
</script>
