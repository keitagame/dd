<script>
// ブラウザ言語に応じたメタ情報の動的最適化
(function optimizeForLanguage() {
  const userLang = navigator.language || navigator.userLanguage;
  if (userLang && !userLang.startsWith('ja')) {
    document.documentElement.lang = 'en';
    document.title = "DopamineDraw - Realtime Online Pixel Canvas (No Cooldown)";
  }
})();

const W = 2000, H = 2000;

// ---- サーバー管理 ----
const DEFAULT_SERVERS = [
  { name: '公式サーバー', url: 'https://keitagames.com/place.cgi' },
  { name: 'ガチ勢向け', url: 'https://hoge.keitagames.com/alpha/place.cgi' },
  { name: '荒らし可能', url: 'https://keitagames.com/arashi/place.cgi' },
  { name: '練習用', url: 'https://hoge.keitagames.com/place.cgi' }
];

function getSavedServers() {
  try {
    const data = localStorage.getItem('dd_servers');
    return data ? JSON.parse(data) : DEFAULT_SERVERS;
  } catch (e) {
    return DEFAULT_SERVERS;
  }
}

function saveServers(servers) {
  try {
    localStorage.setItem('dd_servers', JSON.stringify(servers));
  } catch (e) {}
}

let servers = getSavedServers();
let currentApi = servers[0]?.url || 'place.cgi';

// URLクエリ（?server=... または ?api=...）からの自動追加チェック
const urlParams = new URLSearchParams(window.location.search);
const paramServerUrl = urlParams.get('server') || urlParams.get('api');

if (paramServerUrl) {
  let existing = servers.find(s => s.url === paramServerUrl);
  if (!existing) {
    let name = paramServerUrl;
    try { name = new URL(paramServerUrl, location.href).hostname; } catch(e){}
    existing = { name: `外部 (${name})`, url: paramServerUrl };
    servers.push(existing);
    saveServers(servers);
  }
  currentApi = paramServerUrl;
}

const serverSelect = document.getElementById('serverSelect');
const addServerBtn = document.getElementById('addServerBtn');

function updateServerDropdown() {
  serverSelect.innerHTML = '';
  servers.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.url;
    opt.textContent = s.name;
    if (s.url === currentApi) opt.selected = true;
    serverSelect.appendChild(opt);
  });
}

updateServerDropdown();

serverSelect.addEventListener('change', (e) => {
  currentApi = e.target.value;
  loadAndConnectServer(currentApi);
});

addServerBtn.addEventListener('click', () => {
  const inputUrl = prompt('追加するサーバーのURLを入力してください:\n(例: https://example.com/place.cgi)');
  if (!inputUrl) return;
  
  const trimmed = inputUrl.trim();
  if (!trimmed) return;

  if (servers.some(s => s.url === trimmed)) {
    alert('そのサーバーは既に追加されています。');
    return;
  }

  let defaultName = trimmed;
  try { defaultName = new URL(trimmed, location.href).hostname || trimmed; } catch(e){}
  const name = prompt('サーバーの表示名を入力してください:', defaultName) || defaultName;

  servers.push({ name, url: trimmed });
  saveServers(servers);
  currentApi = trimmed;
  updateServerDropdown();
  loadAndConnectServer(currentApi);
});


const PAL = [
  // 1. モノクロ・グレー・茶系 (16色)
  '#ffffff', '#000000', '#1a1a1a', '#333333', '#555555', '#777777', '#999999', '#bbbbbb', '#dddddd',
  '#2c1e13', '#4e3322', '#784d31', '#a66e4e', '#cf9b7a', '#e8ccb8', '#f7f0eb',
  // 2. 赤・ピンク・紫 (16色)
  '#3b000b', '#6b0014', '#9e0d21', '#d32f2f', '#f44336', '#ff7961', '#ffb2b2', '#ffebee',
  '#4a0033', '#7b0052', '#ad1457', '#e91e63', '#f06292', '#f8bbd0', '#8e24aa', '#ce93d8',
  // 3. 青・水色・シアン (16色)
  '#1a237e', '#283593', '#3f51b5', '#5c6bc0', '#9fa8da', '#0d47a1', '#1976d2', '#42a5f5',
  '#90caf9', '#e3f2fd', '#006064', '#00838f', '#00acc1', '#26c6da', '#80deea', '#e0f7fa',
  // 4. 緑・黄・オレンジ (16色)
  '#004d40', '#00796b', '#009688', '#4db6ac', '#80cbc4', '#1b5e20', '#388e3c', '#4caf50',
  '#81c784', '#c8e6c9', '#f57f17', '#fbc02d', '#ffeb3b', '#fff59d', '#e65100', '#ff9800'
];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

const view = document.getElementById('view');
let scale = 1;
let panX = 0, panY = 0;
let color = 3;

// ---- グリッド & カーソル オーバーレイ ----
const ov = document.getElementById('ov');
const octx = ov.getContext('2d');
const GRID_MIN = 8;     // この倍率以上でマス目を表示
const CURSOR_MIN = 4;   // この倍率以上でカーソルを表示
let hover = null;       // {x, y} 現在ポイントしているマス
let dpr = 1;

function resizeOverlay() {
  dpr = window.devicePixelRatio || 1;
  ov.width = Math.round(view.clientWidth * dpr);
  ov.height = Math.round(view.clientHeight * dpr);
  drawOverlay();
}

function drawOverlay() {
  const vw = view.clientWidth, vh = view.clientHeight;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, vw, vh);

  // マス目
  if (scale >= GRID_MIN) {
    const x0 = Math.max(0, Math.floor(-panX / scale));
    const x1 = Math.min(W, Math.ceil((vw - panX) / scale));
    const y0 = Math.max(0, Math.floor(-panY / scale));
    const y1 = Math.min(H, Math.ceil((vh - panY) / scale));
    const sx0 = panX + x0 * scale, sx1 = panX + x1 * scale;
    const sy0 = panY + y0 * scale, sy1 = panY + y1 * scale;
    octx.beginPath();
    for (let x = x0; x <= x1; x++) {
      const sx = Math.round(panX + x * scale) + 0.5;
      octx.moveTo(sx, sy0); octx.lineTo(sx, sy1);
    }
    for (let y = y0; y <= y1; y++) {
      const sy = Math.round(panY + y * scale) + 0.5;
      octx.moveTo(sx0, sy); octx.lineTo(sx1, sy);
    }
    octx.lineWidth = 1;
    octx.strokeStyle = 'rgba(128,128,128,0.45)';
    octx.stroke();
  }

  // カーソル (選択中の色のプレビュー + 二重枠)
  if (hover && scale >= CURSOR_MIN &&
      hover.x >= 0 && hover.x < W && hover.y >= 0 && hover.y < H) {
    const sx = panX + hover.x * scale;
    const sy = panY + hover.y * scale;
    octx.globalAlpha = 0.6;
    octx.fillStyle = PAL[color];
    octx.fillRect(sx, sy, scale, scale);
    octx.globalAlpha = 1;
    octx.lineWidth = 1;
    octx.strokeStyle = '#000';
    octx.strokeRect(sx + 0.5, sy + 0.5, scale - 1, scale - 1);
    if (scale >= 6) {
      octx.strokeStyle = '#fff';
      octx.strokeRect(sx + 1.5, sy + 1.5, scale - 3, scale - 3);
    }
  }
}

function updateTransform() {
  cv.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  drawOverlay();
}
window.addEventListener('resize', resizeOverlay);

// 画面中央に初期ズーム＆位置調整
function initView() {
  const vw = view.clientWidth;
  const vh = view.clientHeight;
  scale = 2;
  panX = (vw - W * scale) / 2;
  panY = (vh - H * scale) / 2;
  updateTransform();
}
window.addEventListener('load', () => { resizeOverlay(); initView(); });

// 任意座標を中心としたズーム
function zoomAt(cx, cy, factor) {
  const oldScale = scale;
  let newScale = scale * factor;
  newScale = Math.min(Math.max(newScale, 0.05), 40); // 最小・最大ズーム制限

  panX = cx - (cx - panX) * (newScale / oldScale);
  panY = cy - (cy - panY) * (newScale / oldScale);
  scale = newScale;

  updateTransform();
}

// ズームボタン
document.getElementById('zin').onclick = () => zoomAt(view.clientWidth / 2, view.clientHeight / 2, 1.4);
document.getElementById('zout').onclick = () => zoomAt(view.clientWidth / 2, view.clientHeight / 2, 1 / 1.4);

// ホイールズーム
view.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = view.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  zoomAt(cx, cy, e.deltaY < 0 ? 1.2 : 1 / 1.2);
}, { passive: false });

// Pointer Events によるパン操作 & ピンチズーム & 描画
const activePointers = new Map();
let startDist = 0;
let startScale = scale;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let panStartX = 0, panStartY = 0;
let hasMoved = false;

view.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try { view.setPointerCapture(e.pointerId); } catch (_) {}
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  {
    const r = view.getBoundingClientRect();
    hover = { x: Math.floor((e.clientX - r.left - panX) / scale),
              y: Math.floor((e.clientY - r.top - panY) / scale) };
    drawOverlay();
  }

  if (activePointers.size === 1) {
    isDragging = true;
    hasMoved = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
  } else if (activePointers.size === 2) {
    isDragging = false;
    const pts = Array.from(activePointers.values());
    startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    startScale = scale;
  }
});

view.addEventListener('pointermove', (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  const rect = view.getBoundingClientRect();
  const vx = e.clientX - rect.left;
  const vy = e.clientY - rect.top;
  const canvasX = Math.floor((vx - panX) / scale);
  const canvasY = Math.floor((vy - panY) / scale);

  if (!hover || hover.x !== canvasX || hover.y !== canvasY) {
    hover = { x: canvasX, y: canvasY };
    drawOverlay();
  }

  if (canvasX >= 0 && canvasX < W && canvasY >= 0 && canvasY < H) {
    document.getElementById('pos').textContent = `${canvasX}, ${canvasY}`;
  } else {
    document.getElementById('pos').textContent = `-`;
  }

  if (activePointers.size === 1 && isDragging) {
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
      hasMoved = true;
    }
    panX = panStartX + dx;
    panY = panStartY + dy;
    updateTransform();
  } else if (activePointers.size === 2) {
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (startDist > 0) {
      const centerClientX = (pts[0].x + pts[1].x) / 2 - rect.left;
      const centerClientY = (pts[0].y + pts[1].y) / 2 - rect.top;
      const factor = dist / startDist;
      const targetScale = Math.min(Math.max(startScale * factor, 0.05), 40);

      panX = centerClientX - (centerClientX - panX) * (targetScale / scale);
      panY = centerClientY - (centerClientY - panY) * (targetScale / scale);
      scale = targetScale;
      updateTransform();
    }
  }
});

function handlePointerEnd(e) {
  if (!activePointers.has(e.pointerId)) return;
  if (e.type === 'pointerup' && !hasMoved && isDragging && activePointers.size === 1) {
    const rect = view.getBoundingClientRect();
    const vx = e.clientX - rect.left;
    const vy = e.clientY - rect.top;
    const x = Math.floor((vx - panX) / scale);
    const y = Math.floor((vy - panY) / scale);

    if (x >= 0 && x < W && y >= 0 && y < H) {
      const prev = board[y * W + x];
      const cur = color;
      draw(x, y, cur);
      fetch(currentApi, { method: 'POST', body: new URLSearchParams({ a: 'place', x, y, c: cur }) })
        .then(r => { if (!r.ok) throw new Error(r.status); })
        .catch(() => draw(x, y, prev));   // サーバーに保存できなかったら元に戻す
    }
  }
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) startDist = 0;
  if (activePointers.size === 0) isDragging = false;
}

view.addEventListener('pointerleave', (e) => {
  if (e.pointerType === 'mouse' && activePointers.size === 0) { hover = null; drawOverlay(); }
});
view.addEventListener('pointerup', handlePointerEnd);
view.addEventListener('pointercancel', handlePointerEnd);

// パレット生成
const pal = document.getElementById('pal');
PAL.forEach((hex, i) => {
  const b = document.createElement('button');
  b.style.background = hex;
  b.setAttribute('aria-label', '色 ' + (i + 1));
  b.setAttribute('aria-pressed', i === color);
  b.onclick = () => {
    color = i;
    drawOverlay();
    [...pal.children].forEach((el, j) => el.setAttribute('aria-pressed', j === i));
  };
  pal.appendChild(b);
});

const board = new Uint8Array(W * H);
function draw(x, y, c) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  if (!PAL[c]) c = 0;
  board[y * W + x] = c;
  ctx.fillStyle = PAL[c];
  ctx.fillRect(x, y, 1, 1);
}

// 盤面を一括描画
function paintBoard(buf) {
  const rgb = PAL.map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let i = 0; i < buf.length && i < W * H; i++) {
    const c = rgb[buf[i]] ? buf[i] : 0;
    board[i] = c;
    const o = i * 4;
    d[o] = rgb[c][0]; d[o+1] = rgb[c][1]; d[o+2] = rgb[c][2]; d[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// SSE & サーバー接続管理
const dot = document.getElementById('dot'), status = document.getElementById('status');
let lastSeq = 0;
let currentEventSource = null;

function connect(apiUrl, seq) {
  if (currentEventSource) {
    currentEventSource.close();
    currentEventSource = null;
  }

  lastSeq = seq;
  const es = new EventSource(`${apiUrl}?a=stream&from=${lastSeq}`);
  currentEventSource = es;

  es.onopen = () => { dot.className = 'on'; status.textContent = 'ライブ'; };
  es.onmessage = (e) => {
    if (e.lastEventId) lastSeq = parseInt(e.lastEventId, 10) || lastSeq;
    for (const p of e.data.split(';')) {
      const [x, y, c] = p.split(',').map(Number);
      draw(x, y, c);
    }
  };
  es.onerror = () => {
    dot.className = ''; status.textContent = '再接続中';
    if (es.readyState === EventSource.CLOSED && currentEventSource === es) {   // ブラウザが諦めた場合は自前で再接続
      setTimeout(() => {
        if (currentEventSource === es) connect(apiUrl, lastSeq);
      }, 2000);
    }
  };
}

async function loadAndConnectServer(apiUrl) {
  connectChat(apiUrl);   // チャットは盤面の読み込み結果に関係なく接続する
  if (currentEventSource) {
    currentEventSource.close();
    currentEventSource = null;
  }
  
  dot.className = '';
  status.textContent = '接続中...';

  try {
    const res = await fetch(apiUrl + '?a=board', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const seq = parseInt(res.headers.get('X-Seq') || '0', 10);
    paintBoard(new Uint8Array(await res.arrayBuffer()));
    connect(apiUrl, seq);
  } catch (e) {
    status.textContent = '接続失敗';
  }
}

// ---- チャット (chat.cgi / SSE) ----
const chatEl = document.getElementById('chat');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const chatBtn = document.getElementById('chatBtn');
const chatBadge = document.getElementById('chatBadge');
const chatDot = document.getElementById('chatDot');
const chatState = document.getElementById('chatState');
const chatNameBtn = document.getElementById('chatName');
const barEl = document.getElementById('bar');

// 下部バーの高さに合わせてチャットパネルの位置を調整
function updateBarH() {
  document.documentElement.style.setProperty('--bar-h', barEl.offsetHeight + 'px');
}
updateBarH();
if (window.ResizeObserver) new ResizeObserver(updateBarH).observe(barEl);
window.addEventListener('resize', updateBarH);

// 名前
let chatName = '';
try { chatName = localStorage.getItem('dd_name') || ''; } catch (e) {}
function renderChatName() { chatNameBtn.textContent = (chatName || '名無し') + ' ✎'; }
chatNameBtn.onclick = () => {
  const v = prompt('チャットで表示する名前 (20文字まで):', chatName);
  if (v === null) return;
  chatName = v.trim().slice(0, 20);
  try { localStorage.setItem('dd_name', chatName); } catch (e) {}
  renderChatName();
};
renderChatName();

// 開閉 & 未読バッジ
let chatOpen = window.innerWidth >= 700;   // 広い画面では最初から開く
let unread = 0;
function updateBadge() {
  chatBadge.hidden = unread === 0;
  chatBadge.textContent = unread > 99 ? '99+' : String(unread);
}
function setChatOpen(v) {
  chatOpen = v;
  chatEl.hidden = !v;
  if (v) {
    unread = 0; updateBadge();
    chatLog.scrollTop = chatLog.scrollHeight;
    if (window.matchMedia('(pointer: fine)').matches) chatInput.focus();
  }
}
chatBtn.onclick = () => setChatOpen(!chatOpen);
document.getElementById('chatClose').onclick = () => setChatOpen(false);

// 受信
const pad2 = n => String(n).padStart(2, '0');
let chatApi = '';
let chatES = null;
let chatTimer = null;
let chatRetry = 0;
let chatLive = false;      // 過去ログの受信が終わってから true
let lastChatId = 0;

function chatUrlFor(api) { return api.replace(/[^\/]*$/, 'chat.cgi'); }

function addChatMessage(m) {
  if (!m || !(m.id > lastChatId)) return;   // 再接続時の重複を除外
  lastChatId = m.id;
  const atBottom = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 24;

  const row = document.createElement('div');
  const t = document.createElement('span');
  const d = new Date(m.t * 1000);
  t.className = 't';
  t.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const n = document.createElement('b');
  n.textContent = m.n;               // textContentなのでHTMLは解釈されない
  const x = document.createElement('span');
  x.textContent = m.m;
  row.append(t, n, x);
  chatLog.appendChild(row);
  while (chatLog.children.length > 200) chatLog.removeChild(chatLog.firstChild);

  if (atBottom) chatLog.scrollTop = chatLog.scrollHeight;
  if (!chatOpen && chatLive) { unread++; updateBadge(); }
}

function disconnectChat() {
  clearTimeout(chatTimer);
  if (chatES) { chatES.close(); chatES = null; }
}

function openChatStream() {
  const es = new EventSource(`${chatApi}?a=stream&from=${lastChatId}`);
  chatES = es;
  es.onopen = () => {
    chatDot.className = 'on'; chatState.textContent = '';
    chatLive = false; chatRetry = 0;
  };
  es.onmessage = (e) => { try { addChatMessage(JSON.parse(e.data)); } catch (_) {} };
  es.addEventListener('ready', () => {
    chatLive = true;
    chatLog.scrollTop = chatLog.scrollHeight;
  });
  es.onerror = () => {
    chatDot.className = '';
    if (es.readyState === EventSource.CLOSED && chatES === es) {
      // ブラウザが諦めた場合(404など)は間隔を空けて自前で再接続
      chatState.textContent = '接続できません';
      const wait = Math.min(30000, 2000 * Math.pow(2, chatRetry++));
      chatTimer = setTimeout(() => { if (chatES === es) openChatStream(); }, wait);
    } else {
      chatState.textContent = '再接続中';   // サーバー側の接続時間切れ時もここ。すぐ自動再接続される
    }
  };
}

function connectChat(apiUrl) {
  disconnectChat();
  chatApi = chatUrlFor(apiUrl);
  lastChatId = 0; chatRetry = 0; chatLive = false;
  chatLog.textContent = '';
  unread = 0; updateBadge();
  chatDot.className = ''; chatState.textContent = '接続中...';
  openChatStream();
}

// 送信
async function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !chatApi) return;
  chatSend.disabled = true;
  let msg = '';
  try {
    const r = await fetch(chatApi, {
      method: 'POST',
      body: new URLSearchParams({ a: 'post', name: chatName, text })
    });
    if (r.ok) {
      chatInput.value = '';
    } else {
      try { msg = (await r.json()).error || ''; } catch (_) {}
      msg = msg || '送信に失敗しました';
    }
  } catch (_) {
    msg = '送信に失敗しました';
  }
  chatSend.disabled = false;
  if (msg) {
    chatState.textContent = msg;
    setTimeout(() => { if (chatState.textContent === msg) chatState.textContent = ''; }, 3000);
  }
  chatInput.focus();
}
chatSend.onclick = sendChat;
chatSend.addEventListener('mousedown', (e) => e.preventDefault());   // 入力欄のフォーカスを維持
chatInput.addEventListener('keydown', (e) => {
  // IME変換確定のEnterでは送信しない
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    sendChat();
  }
});

setChatOpen(chatOpen);

// 起動処理
loadAndConnectServer(currentApi);
</script>
</body>
</html>
